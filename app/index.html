<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Styx</title>
<meta name="description" content="Share ArduPilot .bin logs without giving away tuning, sensors or hardware. Runs in your browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23202326'/%3E%3Cpath d='M5 13c4-4 7 4 11 0s7 4 11 0M5 20c4-4 7 4 11 0s7 4 11 0' stroke='%23f2b33d' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body data-state="idle">
<header class="bar">
  <b class="logo">Styx</b>
  <div class="seg" id="presets" role="group" aria-label="Preset"></div>
  <span class="sp"></span>
  <button class="tool" data-action="import">Import preset</button>
  <button class="tool" data-action="export">Export preset</button>
  <input type="file" id="import-file" accept=".json,application/json" hidden>
  <label class="tool" for="file" tabindex="0" id="open">Open logs…</label>
  <input type="file" id="file" accept=".bin,.BIN" multiple hidden>
  <button class="go" data-action="download-all" id="download-all" disabled>Export</button>
</header>

<nav class="tabs">
  <div id="tabs" class="tablist"></div>
  <span class="sp"></span>
  <div id="modified" class="modified" hidden></div>
</nav>

<main class="main">
  <section class="left">
    <div class="panes">
      <button class="pane-btn" data-pane="data">Data <span id="data-count"></span></button>
      <button class="pane-btn" data-pane="params">Parameters <span id="param-count"></span></button>
      <button class="pane-btn" data-pane="texts">Text messages <span id="text-count"></span></button>
      <span class="sp"></span>
      <label class="inline" title="Keeps one GPS, one battery, one IMU. Hides how many are fitted.">
        <input type="checkbox" id="primary"> First instance only</label>
    </div>
    <div class="scroll">
      <label id="drop" class="drop" for="file">
        <b>Drop .bin logs here, or click to open</b>
        <span>Logs are processed in this browser. Nothing is uploaded.</span>
      </label>
      <div class="pane" id="pane-data">
        <table class="grid">
          <thead><tr><th class="ck"></th><th>Data</th><th class="n">Records</th><th class="n">Columns</th><th class="n">Size</th><th class="share-h">Share of log</th></tr></thead>
          <tbody id="groups"></tbody>
        </table>
      </div>
      <div class="pane" id="pane-params" hidden></div>
      <div class="pane" id="pane-texts" hidden></div>
    </div>
  </section>

  <aside class="panel" id="panel"></aside>
</main>

<footer class="status">
  <span>Styx 1.0</span>
  <span>© 2026 Aditya Suresh (sasr-e24)</span>
  <span class="sp"></span>
  <a href="legal.html#terms">Terms</a>
  <a href="legal.html#privacy">Privacy</a>
  <a href="legal.html#license">MIT License</a>
  <a href="https://github.com/sasr-e24/Styx">Source</a>
</footer>

<script src="catalog.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
